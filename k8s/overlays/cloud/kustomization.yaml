apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cloud overlay — production-like settings (3 API replicas, larger resource limits).
# Apply with: kubectl apply -k k8s/overlays/cloud

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: api
