# ────────────────────────────────────────────────────────────────────────────
# TEMPLATE — Kubernetes Secret (MLOps Device Health)
# ────────────────────────────────────────────────────────────────────────────
# This file is git-tracked as a TEMPLATE ONLY.
# DO NOT put real credentials here.
#
# How to use:
#   cp k8s/base/secret.example.yaml k8s/base/secret.yaml
#   # Fill in real values in k8s/base/secret.yaml (it is git-ignored)
#   kubectl apply -f k8s/base/secret.yaml     # if applying single file
#   # OR just run: make k8s-up                # picks it up automatically
#
# Value mapping from .env.secrets:
#   DB_PASSWORD               ← DB_PASSWORD
#   AIRFLOW_PASSWORD          ← AIRFLOW_PASSWORD
#   GF_SECURITY_ADMIN_PASSWORD← GRAFANA_PASSWORD
#   API_SECRET_KEY            ← API_SECRET_KEY
#   MLFLOW_TRACKING_USERNAME  ← DAGSHUB_USER  (leave blank for local mode)
#   MLFLOW_TRACKING_PASSWORD  ← DAGSHUB_TOKEN (leave blank for local mode)
# ────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: mlops-secrets
  namespace: mlops
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME_use_same_as_env_secrets_DB_PASSWORD"
  AIRFLOW_PASSWORD: "CHANGE_ME_use_same_as_env_secrets_AIRFLOW_PASSWORD"
  API_SECRET_KEY: "CHANGE_ME_use_same_as_env_secrets_API_SECRET_KEY_min_32_chars"
  GF_SECURITY_ADMIN_PASSWORD: "CHANGE_ME_use_same_as_env_secrets_GRAFANA_PASSWORD"
  MLFLOW_TRACKING_USERNAME: ""
  MLFLOW_TRACKING_PASSWORD: ""
