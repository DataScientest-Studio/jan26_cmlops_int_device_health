apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: mlops
  labels:
    app: grafana
    app.kubernetes.io/part-of: mlops-device-health
data:
  # Datasource: wire Grafana to the in-cluster Prometheus service
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 15s
          queryTimeout: 60s
          httpMethod: POST
        version: 1

  # Dashboard provisioning: load JSONs from /var/lib/grafana/dashboards
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'MLOps Device Health Dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
