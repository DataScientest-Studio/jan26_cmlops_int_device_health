events {
    worker_connections 1024;
}

http {
    # Docker's internal DNS resolver.
    # Using a variable in proxy_pass (see upstream_host below) forces nginx to
    # resolve the hostname at *request time* via this resolver instead of at
    # startup.  Without this, nginx refuses to start when api_challenger is not
    # yet running — which happens on a fresh checkout / nuke-cloud boot.
    # 127.0.0.11 is the fixed address of Docker's embedded DNS server.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Champion upstream (always required).
    upstream api {
        # Champion only — 100 % of traffic
        server api:8000;
        keepalive 32;
    }

    # Challenger address stored in a variable so nginx resolves it lazily (per
    # request) rather than at startup.  If api_challenger is down, requests that
    # would be routed there get a 502 for that specific call only; nginx itself
    # keeps running.
    # The actual A/B weight split is handled in the /predict location below.
    map $request_id $challenger_backend {
        default "api_challenger:8000";
    }

    # A/B split: default 100% champion (0% challenger).
    # Set by Streamlit's Nginx Traffic Split use case when A/B testing is active.
    # $ab_backend is "champion" or "challenger" based on a hash of $request_id.
    split_clients $request_id $ab_backend {
        *     champion;
    }

    # Rate limiting zones (generous for local development — tighten in production)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=predict_limit:10m rate=6000r/m;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Max request body size (file uploads for batch prediction)
    client_max_body_size 10m;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # HTTP Server (Redirect to HTTPS in production)
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Security: Redirect HTTP to HTTPS (uncomment for production)
        # return 301 https://$server_name$request_uri;

        # For local development, allow HTTP
        # Rate limiting
        limit_req zone=api_limit burst=100 nodelay;
        limit_conn addr 50;

        # Proxy settings (applied to all locations)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Root redirect
        location = / {
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Security headers
            add_header X-Content-Type-Options nosniff always;
            # X-Frame-Options removed to allow iframe embedding from Streamlit dashboard
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors *;" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            proxy_pass http://api/;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # API documentation
        location ~ ^/(docs|redoc|openapi.json) {
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Security headers
            add_header X-Content-Type-Options nosniff always;
            # X-Frame-Options removed to allow iframe embedding from Streamlit dashboard
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net; frame-ancestors *;" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            proxy_pass http://api;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Authentication endpoints (stricter rate limiting)
        location ~ ^/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Security headers
            add_header X-Content-Type-Options nosniff always;
            # X-Frame-Options removed to allow iframe embedding from Streamlit dashboard
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors *;" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            proxy_pass http://api;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Prediction endpoint — A/B split: champion 80% / challenger 20%.
        # Uses split_clients to divide traffic by $request_id (random per request).
        # The challenger address is kept in a variable so nginx resolves it lazily
        # and does NOT crash if api_challenger is not running at startup.
        location /predict {
            limit_req zone=predict_limit burst=1500 nodelay;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Security headers
            add_header X-Content-Type-Options nosniff always;
            # X-Frame-Options removed to allow iframe embedding from Streamlit dashboard
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors *;" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            # A/B routing: $ab_backend is set by split_clients (see http block).
            # "champion" → upstream api (always up)
            # "challenger" → variable proxy so nginx starts even if container is absent
            set $predict_upstream "http://api/predict";
            if ($ab_backend = "challenger") {
                set $predict_upstream "http://$challenger_backend/predict";
            }
            proxy_pass $predict_upstream;
            proxy_read_timeout 60s;
            proxy_connect_timeout 30s;
            proxy_buffering off;
        }

        # Labels endpoint (protected)
        location /labels {
            limit_req zone=api_limit burst=50 nodelay;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Security headers
            add_header X-Content-Type-Options nosniff always;
            # X-Frame-Options removed to allow iframe embedding from Streamlit dashboard
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors *;" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            proxy_pass http://api/labels;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Batch evaluation endpoint (authenticated, higher timeout for large batches)
        location /evaluate {
            limit_req zone=predict_limit burst=20 nodelay;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Security headers
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors *;" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            proxy_pass http://api/evaluate;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # MLflow Buffer UI — proxied through nginx so the browser can embed it
        # in the Streamlit Services viewer (strips SAMEORIGIN X-Frame-Options).
        # nginx strips the /mlflow-buffer prefix and forwards to mlflow_buffer:5000/
        # MLflow runs without --static-prefix, so all its routes are at /.
        # Use a variable so nginx resolves the hostname at request time (deferred DNS)
        # rather than at startup.  This allows nginx to start cleanly in local mode
        # where mlflow_buffer is absent; requests to /mlflow-buffer/ return 502 in
        # that mode, which is acceptable.
        location /mlflow-buffer/ {
            set $mlflow_buffer_upstream mlflow_buffer:5000;
            proxy_pass http://$mlflow_buffer_upstream/;
            proxy_hide_header X-Frame-Options;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header X-Frame-Options "ALLOWALL" always;
            proxy_buffering off;
        }

        # Nginx self-health — used by Docker healthcheck (does NOT proxy to API)
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Health check (public, no auth required)
        location /health {
            access_log off;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Security headers
            add_header X-Content-Type-Options nosniff always;
            # X-Frame-Options removed to allow iframe embedding from Streamlit dashboard
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors *;" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            proxy_pass http://api/health;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
        }

        # Prometheus metrics endpoint (public for monitoring, restrict in production)
        location /metrics {
            # Uncomment to restrict to internal network in production
            # allow 10.0.0.0/8;
            # allow 172.16.0.0/12;
            # allow 192.168.0.0/16;
            # deny all;

            access_log off;

            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Security headers
            add_header X-Content-Type-Options nosniff always;
            # X-Frame-Options removed to allow iframe embedding from Streamlit dashboard
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors *;" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            proxy_pass http://api/metrics;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Business statistics endpoint (public, JSON format)
        location /stats {
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Security headers
            add_header X-Content-Type-Options nosniff always;
            # X-Frame-Options removed to allow iframe embedding from Streamlit dashboard
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors *;" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            proxy_pass http://api/stats;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Model info endpoint (protected)
        location /model/info {
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Security headers
            add_header X-Content-Type-Options nosniff always;
            # X-Frame-Options removed to allow iframe embedding from Streamlit dashboard
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors *;" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            proxy_pass http://api/model/info;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Admin endpoints (protected)
        location /admin/ {
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Security headers
            add_header X-Content-Type-Options nosniff always;
            # X-Frame-Options removed to allow iframe embedding from Streamlit dashboard
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors *;" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            proxy_pass http://api/admin/;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # General API endpoints
        location /api/ {
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-API-Key' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Security headers
            add_header X-Content-Type-Options nosniff always;
            # X-Frame-Options removed to allow iframe embedding from Streamlit dashboard
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors *;" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            proxy_pass http://api/;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Block access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ==============================================================================
    # HTTPS Server — self-signed certificate (auto-generated by generate_certs.sh)
    # ==============================================================================

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS — tell browsers to prefer HTTPS for 1 year
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Nginx self-health (HTTPS)
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Health check
        location /health {
            access_log off;
            proxy_pass http://api/health;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
        }

        # Root
        location = / {
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors *;" always;
            proxy_pass http://api/;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Docs
        location ~ ^/(docs|redoc|openapi.json) {
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors *;" always;
            proxy_pass http://api;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # Prediction
        location /predict {
            proxy_pass http://api/predict;
            proxy_read_timeout 60s;
            proxy_connect_timeout 30s;
        }

        # Labels
        location /labels {
            proxy_pass http://api/labels;
            proxy_read_timeout 30s;
        }

        # Batch evaluation
        location /evaluate {
            proxy_pass http://api/evaluate;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # Metrics
        location /metrics {
            access_log off;
            proxy_pass http://api/metrics;
            proxy_read_timeout 30s;
        }

        # Stats
        location /stats {
            proxy_pass http://api/stats;
            proxy_read_timeout 30s;
        }

        # Model info
        location /model/info {
            proxy_pass http://api/model/info;
            proxy_read_timeout 30s;
        }

        # Admin
        location /admin/ {
            proxy_pass http://api/admin/;
            proxy_read_timeout 30s;
        }

        # General API
        location /api/ {
            proxy_pass http://api/;
            proxy_read_timeout 60s;
        }

        # Block hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
