# Blackbox Exporter Configuration
# Probes HTTP/HTTPS endpoints and reports probe_success (0/1) to Prometheus.
# Used by NginxDown and AirflowDown alert rules.
modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []  # default: 2xx
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"
