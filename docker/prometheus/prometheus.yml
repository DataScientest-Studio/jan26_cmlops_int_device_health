# Prometheus Configuration for MLOps Device Health Monitoring
#
# This configuration defines:
# - Global scrape settings
# - Scrape targets (API metrics endpoint)
# - Service discovery
# - Alert rules
# - Alertmanager integration

global:
  scrape_interval: 15s  # Scrape metrics every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  scrape_timeout: 10s  # Timeout after 10 seconds

  # External labels - added to all metrics
  external_labels:
    environment: 'development'
    project: 'mlops_device_health'
    monitor: 'prometheus'

# Alerting configuration - send alerts to Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s

# Alert rules configuration - load alert conditions
rule_files:
  - '/etc/prometheus/alerts.yml'

# Scrape configurations
scrape_configs:
  # API Metrics - FastAPI application metrics (Champion API)
  - job_name: 'mlops_api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true

    # Relabeling for better metric organization
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'mlops_api'

    # Metric relabeling (optional post-processing)
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'python_.*'
        action: drop  # Drop Python GC metrics (too noisy for this use case)

  # Challenger API Metrics — A/B Testing (cloud mode only)
  # Only present when docker-compose.cloud.yml is active and api_challenger is running.
  # In local mode the container does not exist; Prometheus will show up=0 — expected.
  # job_name 'mlops_api_challenger' is used by the A/B Grafana dashboard to distinguish
  # challenger predictions from champion (job='mlops_api') predictions.
  - job_name: 'mlops_api_challenger'
    static_configs:
      - targets: ['api_challenger:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'mlops_api_challenger'

    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'python_.*'
        action: drop

  # MLflow Buffer — health monitoring via Blackbox HTTP probe
  # NOTE: MLflow does not expose a Prometheus /metrics endpoint.
  # /health returns JSON, not Prometheus text format — cannot be scraped directly.
  # Using blackbox_exporter to probe liveness instead: probe_success=1 → healthy.
  # Alert: MLflowBufferDown fires if probe_success{job="blackbox_mlflow"} == 0 for 2m.
  - job_name: 'blackbox_mlflow'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://mlops_mlflow_buffer:5000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
    scrape_interval: 30s
    scrape_timeout: 10s

  # PostgreSQL App DB Exporter — FU-PG-MONITOR
  # Scrapes mlops_postgres_exporter (present in both local and cloud mode).
  # Provides: active connections, query duration, cache hit ratio, lock waits.
  - job_name: 'postgres_app'
    static_configs:
      - targets: ['postgres_exporter:9187']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # PostgreSQL MLflow Buffer DB Exporter — FU-PG-MONITOR (cloud mode only)
  # Scrapes mlops_postgres_mlflow_exporter.
  # Will return "up=0" in local mode (container not running) — expected.
  - job_name: 'postgres_mlflow'
    static_configs:
      - targets: ['postgres_mlflow_exporter:9187']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Alertmanager self-monitoring
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Node Exporter - Host system metrics (CPU, memory, disk, network)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'mlops_host'

  # cAdvisor - Container metrics (CPU, memory, network per container)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true

    # Filter to only include our containers.
    # The Docker Compose project name comes from the directory name
    # (mlops-device-health) so use a regex dot to match the separator
    # character (hyphen or underscore) for robustness.
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: 'mlops.device.health'
        action: keep
      - source_labels: [__name__]
        regex: 'container_(cpu_usage_seconds_total|memory_usage_bytes|network_receive_bytes_total|network_transmit_bytes_total|fs_usage_bytes|fs_limit_bytes)'
        action: keep

  # Blackbox Exporter — HTTP probe for Nginx reverse proxy
  # probe_success=0 → NginxDown alert fires after 2m
  - job_name: 'blackbox_nginx'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://nginx:80/nginx-health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
    scrape_interval: 30s
    scrape_timeout: 10s

  # Blackbox Exporter — HTTP probe for Airflow webserver
  # probe_success=0 → AirflowDown alert fires after 2m
  - job_name: 'blackbox_airflow'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://airflow:8080/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
    scrape_interval: 30s
    scrape_timeout: 10s

  # Blackbox Exporter self-monitoring
  # Scrapes the exporter's own /metrics so Prometheus can detect
  # if blackbox_exporter itself is down (otherwise probe jobs silently stop).
  - job_name: 'blackbox_exporter'
    static_configs:
      - targets: ['blackbox_exporter:9115']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
