# Kind cluster configuration for CI (deploy-k8s.yml workflow).
# Exposes NodePort 30080 on the host so the smoke test can curl the API.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
