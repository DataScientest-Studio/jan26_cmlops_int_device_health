name: Model Quality Gate

# Runs when training-related code or the quality gate reference data changes.
# Trains a fresh model on the golden reference signals (data/ci/quality_gate_signals.csv)
# and fails the PR if accuracy or F1 falls below the thresholds in params.yaml.
#
# What this tests: does the CURRENT training code still produce a model that meets
# minimum quality thresholds? This catches regressions in feature extraction,
# training hyperparameters, and model code — without needing Docker, DagsHub, or MLflow.
#
# See doc/GitHub_Actions_Reference.md Section 15 for the full design rationale.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/signal_processing/**"
      - "src/training/**"
      - "src/models/**"
      - "src/training/train.py"
      - "scripts/greenfield_init.py"
      - "scripts/ci_quality_gate.py"
      - "scripts/ci_generate_bootstrap_model.py"
      - "params.yaml"
      - "data/ci/quality_gate_signals.csv"
  workflow_dispatch:

jobs:
  quality-gate:
    name: Train + Evaluate on Golden Reference Signals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --dev

      - name: Verify quality gate reference data exists
        run: |
          if [ ! -f "data/ci/quality_gate_signals.csv" ]; then
            echo "ERROR: data/ci/quality_gate_signals.csv not found."
            echo "Run: python scripts/generate_ci_quality_gate_data.py"
            echo "Then commit the generated file to git."
            exit 1
          fi
          ROWS=$(tail -n +2 data/ci/quality_gate_signals.csv | wc -l)
          echo "Quality gate signals: ${ROWS} rows"

      - name: Run model quality gate
        env:
          MODEL_REGISTRY_ENABLED: "false"
        run: uv run python scripts/ci_quality_gate.py

      - name: Upload quality gate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate-results
          path: reports/ci_quality_gate_results.json
          retention-days: 30
